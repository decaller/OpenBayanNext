services:
  # 1. Live Search API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shamela_backend
    volumes:
      - ./data:/data:ro
    ports:
      - "8000:8000"

  # 2. Prefect Orchestration Server & Dashboard (Optional UI)
  prefect-server:
    image: prefecthq/prefect:2-python3.12
    container_name: shamela_prefect_server
    command: prefect server start --host 0.0.0.0
    ports:
      - "4200:4200"
    environment:
      - PREFECT_SERVER_API_HOST=0.0.0.0
    volumes:
      - ./prefect_data:/root/.prefect

  # 3. Dedicated Ingestion Worker
  ingestion-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shamela_ingestion_worker
    command: python -m pipeline.ingest_flow
    environment:
      - PREFECT_API_URL=http://prefect-server:4200/api
      - DB_PATH=/data/shamela_corpus.db
    volumes:
      - ./data:/data:rw # Read-Write access during ingestion
      - ./raw_texts:/raw_texts:ro
    depends_on:
      - prefect-server
